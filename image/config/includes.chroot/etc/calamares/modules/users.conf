---
userGroup: users
defaultGroups:
  - cdrom
  - floppy
  - sudo
  - audio
  - dip
  - video
  - plugdev
  - netdev
  - lpadmin
  - scanner
  - bluetooth
autologinGroup: autologin
sudoersGroup: sudo
setRootPassword: false

passwordRequirements:
  nonempty: true
  minLength: 8
  maxLength: -1
  libpwquality:
    - minlen=8
    - minclass=1
